[build-system]
requires = ["setuptools>=68","wheel"]
build-backend ="setuptools.build_meta"

[project]
name ="lumenstage"
version ="0.1.0"
description ="Theater and performing-arts production toolkit for productions, venues, cast, rehearsals, cues, props, costumes, and call sheets."
readme ="README.md"
requires-python =">=3.11"
license = { text ="MIT" }
authors = []
dependencies = []

[project.optional-dependencies]
dev = ["pytest==8.3.4", "pytest-cov==6.0.0", "ruff==0.8.4"]

[project.scripts]
lumenstage ="lumenstage.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["lumenstage"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
